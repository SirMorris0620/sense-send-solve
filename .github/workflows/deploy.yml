# Builds index.html with your course server URL and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions";
#                 Settings → Secrets and variables → Actions → Variables → New: SSS_API_URL = your /exec URL.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build index.html with the course server URL
        env:
          SSS_API_URL: ${{ vars.SSS_API_URL }}
        run: |
          python3 build.py
          grep -q 'API_URL: "https://script.google.com/macros/s/' dist/index.html || { echo "SSS_API_URL is not set: the site would be in preview mode."; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
